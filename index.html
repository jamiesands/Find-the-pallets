<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Pallets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #87ceeb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameCanvas {
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        // Game Configuration
        const CONFIG = {
            canvas: { width: 800, height: 600 },
            world: { width: 2400, height: 1400 },
            player: {
                width: 24,
                height: 24,
                speed: 3.5,
                x: 700,
                y: 700
            },
            game: {
                totalPallets: 10,
                timeLimit: 60,
                interactionRadius: 40,
                doorCooldown: 300
            }
        };

        // Initialize Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CONFIG.canvas.width;
        canvas.height = CONFIG.canvas.height;

        // Game State
        let gameState = 'start';
        const keys = {};
        let keyPressed = {};

        // Scene System
        let currentSceneId = 'yard';
        let scenes = {};
        let fadeAlpha = 0;
        let fadeDirection = 0;
        let pendingSceneSwitch = null;
        let doorCooldownUntil = 0;

        // Game variables
        let timeRemaining = CONFIG.game.timeLimit;
        let timerStarted = false;
        let lastFrameTime = Date.now();
        let palletsCollected = 0;
        let score = 0;

        // Load best score with error handling
        let bestScore = 0;
        try {
            bestScore = parseInt(localStorage.getItem('palletsBestScore') || '0') || 0;
        } catch (e) {
            console.warn('Could not load best score from localStorage:', e);
        }

        let showMinimap = false;
        let showDebug = false;
        let particles = [];

        // Camera
        const camera = {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            smoothing: 0.1,

            update(player) {
                const scene = scenes[currentSceneId];

                this.targetX = player.x - CONFIG.canvas.width / 2;
                this.targetY = player.y - CONFIG.canvas.height / 2;

                this.targetX = Math.max(0, Math.min(this.targetX, scene.width - CONFIG.canvas.width));
                this.targetY = Math.max(0, Math.min(this.targetY, scene.height - CONFIG.canvas.height));

                this.x += (this.targetX - this.x) * this.smoothing;
                this.y += (this.targetY - this.y) * this.smoothing;

                this.x = Math.max(0, Math.min(this.x, scene.width - CONFIG.canvas.width));
                this.y = Math.max(0, Math.min(this.y, scene.height - CONFIG.canvas.height));
            }
        };

        // World data
        let missingPallets = [];
        let forklifts = [];

        // Spawn validation
        function validateAndFixSpawn(x, y) {
            const scene = scenes[currentSceneId];

            // Check if current position is valid
            const playerBox = {
                x: x - CONFIG.player.width/2,
                y: y - CONFIG.player.height/2,
                width: CONFIG.player.width,
                height: CONFIG.player.height
            };

            // Check collision with current position
            const hasCollision = scene.obstacles.some(obs => rectCollision(playerBox, obs));

            if (!hasCollision) {
                return { x, y, adjusted: false };
            }

            // Position is invalid, search outward
            if (showDebug) {
                console.log(`[Spawn Safety] Invalid spawn at (${x}, ${y}), searching for safe position...`);
            }

            const searchStep = 8;
            const maxRadius = 200;

            // Spiral search outward
            for (let radius = searchStep; radius <= maxRadius; radius += searchStep) {
                const angles = Math.ceil(radius / searchStep) * 8;
                for (let i = 0; i < angles; i++) {
                    const angle = (Math.PI * 2 * i) / angles;
                    const testX = x + Math.cos(angle) * radius;
                    const testY = y + Math.sin(angle) * radius;

                    // Check bounds
                    if (testX < CONFIG.player.width/2 ||
                        testX > scene.width - CONFIG.player.width/2 ||
                        testY < CONFIG.player.height/2 ||
                        testY > scene.height - CONFIG.player.height/2) {
                        continue;
                    }

                    const testBox = {
                        x: testX - CONFIG.player.width/2,
                        y: testY - CONFIG.player.height/2,
                        width: CONFIG.player.width,
                        height: CONFIG.player.height
                    };

                    const testCollision = scene.obstacles.some(obs => rectCollision(testBox, obs));
                    if (!testCollision) {
                        if (showDebug) {
                            console.log(`[Spawn Safety] Found safe position at (${Math.floor(testX)}, ${Math.floor(testY)}) after searching ${radius}px radius`);
                        }
                        return { x: testX, y: testY, adjusted: true };
                    }
                }
            }

            // If still no safe spot found, use fallback
            const fallback = scene.safeFallbackSpawn || { x: scene.width / 2, y: scene.height / 2 };

            // Validate fallback position isn't in an obstacle
            const fallbackBox = {
                x: fallback.x - CONFIG.player.width/2,
                y: fallback.y - CONFIG.player.height/2,
                width: CONFIG.player.width,
                height: CONFIG.player.height
            };

            const fallbackCollision = scene.obstacles.some(obs => rectCollision(fallbackBox, obs));
            if (fallbackCollision) {
                console.error('[Spawn Safety] CRITICAL: Fallback spawn is invalid! Using absolute scene center.');
                // Last resort: absolute center of scene (hope for the best)
                return { x: scene.width / 2, y: scene.height / 2, adjusted: true };
            }

            if (showDebug) {
                console.log(`[Spawn Safety] No safe position found, using fallback (${fallback.x}, ${fallback.y})`);
            }
            return { x: fallback.x, y: fallback.y, adjusted: true };
        }

        function rectCollision(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        // Viewport culling helper - checks if object is visible on screen
        function isInViewport(obj, padding = 50) {
            const objWidth = obj.width || 0;
            const objHeight = obj.height || 0;
            return obj.x + objWidth > camera.x - padding &&
                   obj.x < camera.x + CONFIG.canvas.width + padding &&
                   obj.y + objHeight > camera.y - padding &&
                   obj.y < camera.y + CONFIG.canvas.height + padding;
        }

        // Player
        const player = {
            x: CONFIG.player.x,
            y: CONFIG.player.y,
            width: CONFIG.player.width,
            height: CONFIG.player.height,
            speed: CONFIG.player.speed,
            direction: 0,
            hasMoved: false,
            stunned: false,
            stunnedUntil: 0,

            update() {
                if (this.stunned && Date.now() > this.stunnedUntil) {
                    this.stunned = false;
                }

                if (this.stunned) return;

                let dx = 0;
                let dy = 0;

                if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                    dy -= this.speed;
                    this.direction = 2;
                    this.hasMoved = true;
                }
                if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                    dy += this.speed;
                    this.direction = 0;
                    this.hasMoved = true;
                }
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                    dx -= this.speed;
                    this.direction = 3;
                    this.hasMoved = true;
                }
                if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                    dx += this.speed;
                    this.direction = 1;
                    this.hasMoved = true;
                }

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.707;
                    dy *= 0.707;
                }

                const newX = this.x + dx;
                const newY = this.y + dy;

                if (!this.checkCollision(newX, this.y)) {
                    this.x = newX;
                }
                if (!this.checkCollision(this.x, newY)) {
                    this.y = newY;
                }

                const scene = scenes[currentSceneId];
                this.x = Math.max(this.width/2, Math.min(this.x, scene.width - this.width/2));
                this.y = Math.max(this.height/2, Math.min(this.y, scene.height - this.height/2));

                if (this.hasMoved && !timerStarted) {
                    timerStarted = true;
                }
            },

            checkCollision(x, y) {
                const playerBox = {
                    x: x - this.width/2,
                    y: y - this.height/2,
                    width: this.width,
                    height: this.height
                };
                const scene = scenes[currentSceneId];
                return scene.obstacles.some(obs => rectCollision(playerBox, obs));
            },

            getNearestPallet() {
                let nearest = null;
                let minDist = CONFIG.game.interactionRadius;

                missingPallets.forEach(pallet => {
                    if (!pallet.collected && pallet.sceneId === currentSceneId) {
                        const dist = Math.hypot(this.x - pallet.x, this.y - pallet.y);
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = pallet;
                        }
                    }
                });

                return nearest;
            },

            getNearestDoor() {
                if (Date.now() < doorCooldownUntil) {
                    return null;
                }

                const scene = scenes[currentSceneId];
                if (!scene.doors) return null;

                let nearest = null;
                let minDist = CONFIG.game.interactionRadius;

                scene.doors.forEach(door => {
                    const doorCenterX = door.x + door.width / 2;
                    const doorCenterY = door.y + door.height / 2;
                    const dist = Math.hypot(this.x - doorCenterX, this.y - doorCenterY);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = door;
                    }
                });

                return nearest;
            },

            getBox() {
                return {
                    x: this.x - this.width/2,
                    y: this.y - this.height/2,
                    width: this.width,
                    height: this.height
                };
            },

            draw() {
                ctx.save();

                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(this.x + 2, this.y + this.height/2 + 4,
                           this.width/2 - 2, this.height/4, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.stunned) {
                    ctx.globalAlpha = 0.5;
                }

                ctx.fillStyle = '#ff6b35';
                ctx.fillRect(this.x - this.width/2, this.y - this.height/2,
                            this.width, this.height);

                ctx.fillStyle = '#ffb88c';
                ctx.fillRect(this.x - 8, this.y - this.height/2 - 6, 16, 8);

                ctx.fillStyle = '#000';
                if (this.direction === 0) {
                    ctx.fillRect(this.x - 4, this.y - this.height/2 - 3, 2, 2);
                    ctx.fillRect(this.x + 2, this.y - this.height/2 - 3, 2, 2);
                } else if (this.direction === 1) {
                    ctx.fillRect(this.x + 2, this.y - this.height/2 - 3, 2, 2);
                } else if (this.direction === 2) {
                    ctx.fillRect(this.x - 4, this.y - this.height/2 - 4, 2, 1);
                    ctx.fillRect(this.x + 2, this.y - this.height/2 - 4, 2, 1);
                } else {
                    ctx.fillRect(this.x - 4, this.y - this.height/2 - 3, 2, 2);
                }

                ctx.fillStyle = '#ffed4e';
                ctx.fillRect(this.x - this.width/2 + 2, this.y - 4, this.width - 4, 2);
                ctx.fillRect(this.x - this.width/2 + 2, this.y + 4, this.width - 4, 2);

                ctx.globalAlpha = 1;
                ctx.restore();
            }
        };

        // Scene Builder Functions
        function buildYardScene() {
            const scene = {
                id: 'yard',
                width: CONFIG.world.width,
                height: CONFIG.world.height,
                groundAreas: [],
                obstacles: [],
                decorations: [],
                doors: [],
                safeFallbackSpawn: { x: 700, y: 700 }
            };

            // Base grass
            scene.groundAreas.push({
                type: 'grass',
                x: 0, y: 0,
                width: scene.width,
                height: scene.height
            });

            // Road across top
            scene.groundAreas.push({
                type: 'road',
                x: 0, y: 0,
                width: scene.width,
                height: 80
            });

            // Road down left side
            scene.groundAreas.push({
                type: 'road',
                x: 0, y: 0,
                width: 80,
                height: scene.height
            });

            // Car park tarmac (top left)
            scene.groundAreas.push({
                type: 'tarmac',
                x: 100, y: 100,
                width: 300,
                height: 400
            });

            // Yard tarmac (center area)
            scene.groundAreas.push({
                type: 'tarmac',
                x: 100, y: 550,
                width: 2200,
                height: 300
            });

            // Workshop area tarmac (bottom left)
            scene.groundAreas.push({
                type: 'tarmac',
                x: 100, y: 900,
                width: 1200,
                height: 400
            });

            // === CAR PARK (top left) ===
            // Car parking bays (4 rows of 5)
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 4; j++) {
                    scene.decorations.push({
                        type: 'parking-bay',
                        x: 120 + i * 55,
                        y: 120 + j * 90,
                        width: 45,
                        height: 80
                    });
                }
            }

            // Add some parked cars in random spots
            const carSpots = [
                { x: 120, y: 120 },
                { x: 175, y: 210 },
                { x: 230, y: 120 },
                { x: 285, y: 300 },
                { x: 340, y: 210 },
                { x: 120, y: 390 },
                { x: 230, y: 300 }
            ];

            carSpots.forEach(spot => {
                scene.decorations.push({
                    type: 'parked-car',
                    x: spot.x,
                    y: spot.y,
                    width: 45,
                    height: 80
                });
            });

            // === OFFICE (top, right of car park) ===
            scene.obstacles.push({
                type: 'office',
                x: 430, y: 100,
                width: 220,
                height: 400
            });

            // Office door - on left side
            scene.doors.push({
                x: 420,
                y: 280,
                width: 20,
                height: 50,
                label: 'Enter Office',
                targetSceneId: 'officeInterior',
                targetSpawnX: 100,
                targetSpawnY: 400
            });

            // Visual door on office exterior (left side)
            scene.decorations.push({
                type: 'exit-door',
                x: 420,
                y: 280,
                width: 20,
                height: 50
            });

            // === LARGE WAREHOUSE (top, right of office) ===
            const warehouse = {
                type: 'warehouse-main',
                x: 680, y: 100,
                width: 800,
                height: 400,
                bays: []
            };

            const bayWidth = 70;
            const baySpacing = (warehouse.width - bayWidth * 8) / 9;

            for (let i = 0; i < 8; i++) {
                const bayX = warehouse.x + baySpacing + i * (bayWidth + baySpacing);
                const bayY = warehouse.y + warehouse.height;

                warehouse.bays.push({
                    x: bayX,
                    y: bayY,
                    width: bayWidth,
                    height: 5,
                    number: i + 1
                });
            }

            scene.obstacles.push(warehouse);

            // Warehouse doors - one for each bay
            for (let i = 0; i < 8; i++) {
                const bayX = warehouse.x + baySpacing + i * (bayWidth + baySpacing);
                const bayY = warehouse.y + warehouse.height;

                scene.doors.push({
                    x: bayX + 5,
                    y: bayY + 10,
                    width: bayWidth - 10,
                    height: 20,
                    label: `Bay ${i + 1}`,
                    targetSceneId: 'warehouseInterior',
                    targetSpawnX: 200 + i * 200,
                    targetSpawnY: 900
                });
            }

            // === TRAILER PARK (top right, right of warehouse) ===
            // Parked trailers
            const trailerStartX = 1510;
            const trailerStartY = 120;
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 6; col++) {
                    scene.obstacles.push({
                        type: 'trailer',
                        x: trailerStartX + col * 140,
                        y: trailerStartY + row * 200,
                        width: 50,
                        height: 150,
                        id: row * 6 + col
                    });
                }
            }

            // === WORKSHOP (bottom left) ===
            scene.obstacles.push({
                type: 'workshop',
                x: 100, y: 900,
                width: 280,
                height: 250
            });

            // Workshop door
            scene.doors.push({
                x: 190,
                y: 1160,
                width: 50,
                height: 20,
                label: 'Enter Workshop',
                targetSceneId: 'workshopInterior',
                targetSpawnX: 300,
                targetSpawnY: 350
            });

            // === PARKED TRUCKS (bottom, right of workshop) ===
            const truckStartX = 420;
            const truckStartY = 1000;
            const truckSpacing = 110;

            for (let i = 0; i < 6; i++) {
                scene.obstacles.push({
                    type: 'truck',
                    x: truckStartX + i * truckSpacing,
                    y: truckStartY,
                    width: 40,
                    height: 90,
                    id: i
                });
            }

            // === TREES (bottom right grassy area) ===
            const treePositions = [
                { x: 1400, y: 950, size: 35 },
                { x: 1550, y: 1050, size: 40 },
                { x: 1700, y: 920, size: 30 },
                { x: 1850, y: 1100, size: 38 },
                { x: 2000, y: 980, size: 35 },
                { x: 2150, y: 1150, size: 42 },
                { x: 1600, y: 1200, size: 33 },
                { x: 1900, y: 1250, size: 36 },
                { x: 2200, y: 1050, size: 40 },
                { x: 2050, y: 1300, size: 35 }
            ];

            treePositions.forEach(tree => {
                // Add as obstacle (trunk collision)
                scene.obstacles.push({
                    type: 'tree',
                    x: tree.x - tree.size * 0.3,
                    y: tree.y - tree.size * 0.3,
                    width: tree.size * 0.6,
                    height: tree.size * 0.6
                });

                // Add as decoration (visual)
                scene.decorations.push({
                    type: 'tree',
                    x: tree.x,
                    y: tree.y,
                    size: tree.size
                });
            });

            return scene;
        }

        function buildWarehouseInterior() {
            const scene = {
                id: 'warehouseInterior',
                width: 1800,
                height: 1000,
                groundAreas: [],
                obstacles: [],
                decorations: [],
                doors: [],
                renderSettings: {
                    ambientBrightness: 0.85,
                    vignetteStrength: 0.3
                },
                safeFallbackSpawn: { x: 900, y: 500 }
            };

            scene.groundAreas.push({
                type: 'warehouse-floor',
                x: 0, y: 0,
                width: scene.width,
                height: scene.height
            });

            // Perimeter walls
            scene.obstacles.push({ type: 'wall', x: 0, y: 0, width: scene.width, height: 20 });
            scene.obstacles.push({ type: 'wall', x: 0, y: scene.height - 20, width: scene.width, height: 20 });
            scene.obstacles.push({ type: 'wall', x: 0, y: 0, width: 20, height: scene.height });
            scene.obstacles.push({ type: 'wall', x: scene.width - 20, y: 0, width: 20, height: scene.height });

            // Equally spaced racking rows
            const numRacks = 6;
            const rackWidth = 80;
            const rackHeight = 600;
            const totalRackWidth = numRacks * rackWidth;
            const availableSpace = scene.width - totalRackWidth - 40; // 40 for margins
            const rackSpacing = availableSpace / (numRacks + 1);

            for (let i = 0; i < numRacks; i++) {
                scene.obstacles.push({
                    type: 'racking',
                    x: 20 + rackSpacing + i * (rackWidth + rackSpacing),
                    y: 150,
                    width: rackWidth,
                    height: rackHeight
                });
            }

            // Visual door from office (on left side of warehouse)
            scene.decorations.push({
                type: 'exit-door',
                x: 20,
                y: 370,
                width: 40,
                height: 60
            });

            // Door to office (on left side of warehouse)
            scene.doors.push({
                x: 20,
                y: 370,
                width: 40,
                height: 60,
                label: 'To Office',
                targetSceneId: 'officeInterior',
                targetSpawnX: 1100,
                targetSpawnY: 400
            });

            for (let x = 100; x < scene.width; x += 200) {
                scene.decorations.push({
                    type: 'floor-marking',
                    x, y: 800,
                    width: 150,
                    height: 3
                });
            }

            const palletStacks = [
                { x: 100, y: 200 },
                { x: 550, y: 300 },
                { x: 900, y: 500 },
                { x: 1200, y: 250 }
            ];

            palletStacks.forEach(pos => {
                scene.decorations.push({
                    type: 'pallet-stack',
                    x: pos.x,
                    y: pos.y,
                    width: 40,
                    height: 40
                });
            });

            // Exit doors - 8 doors matching the 8 bays outside
            const doorWidth = 60;
            const totalDoorWidth = doorWidth * 8;
            const doorSpacing = (scene.width - totalDoorWidth) / 9;

            for (let i = 0; i < 8; i++) {
                const doorX = doorSpacing + i * (doorWidth + doorSpacing);

                // Visual representation of bay door
                scene.decorations.push({
                    type: 'bay-door',
                    x: doorX,
                    y: scene.height - 70,
                    width: doorWidth,
                    height: 40,
                    number: i + 1
                });

                scene.doors.push({
                    x: doorX,
                    y: scene.height - 70,
                    width: doorWidth,
                    height: 40,
                    label: `Exit Bay ${i + 1}`,
                    targetSceneId: 'yard',
                    targetSpawnX: 680 + 20 + (70 + 20) * i + 35,  // Position at each bay
                    targetSpawnY: 530
                });
            }

            return scene;
        }

        function buildOfficeInterior() {
            const scene = {
                id: 'officeInterior',
                width: 1200,
                height: 800,
                groundAreas: [],
                obstacles: [],
                decorations: [],
                doors: [],
                renderSettings: {
                    ambientBrightness: 0.9,
                    vignetteStrength: 0.2
                },
                safeFallbackSpawn: { x: 600, y: 400 }
            };

            scene.groundAreas.push({
                type: 'office-floor',
                x: 0, y: 0,
                width: scene.width,
                height: scene.height
            });

            scene.obstacles.push({ type: 'wall', x: 0, y: 0, width: scene.width, height: 20 });
            scene.obstacles.push({ type: 'wall', x: 0, y: scene.height - 20, width: scene.width, height: 20 });
            scene.obstacles.push({ type: 'wall', x: 0, y: 0, width: 20, height: scene.height });
            scene.obstacles.push({ type: 'wall', x: scene.width - 20, y: 0, width: 20, height: scene.height });

            const desks = [
                { x: 100, y: 150, width: 60, height: 40 },
                { x: 200, y: 150, width: 60, height: 40 },
                { x: 300, y: 150, width: 60, height: 40 },
                { x: 100, y: 250, width: 60, height: 40 },
                { x: 200, y: 250, width: 60, height: 40 },
                { x: 300, y: 250, width: 60, height: 40 },
                { x: 500, y: 150, width: 60, height: 40 },
                { x: 600, y: 150, width: 60, height: 40 },
                { x: 500, y: 250, width: 60, height: 40 },
                { x: 600, y: 250, width: 60, height: 40 }
            ];

            desks.forEach(desk => {
                scene.obstacles.push({ type: 'desk', ...desk });
            });

            scene.obstacles.push({ type: 'meeting-room', x: 850, y: 150, width: 280, height: 200 });

            scene.decorations.push({ type: 'plant', x: 450, y: 100, size: 30 });
            scene.decorations.push({ type: 'plant', x: 750, y: 100, size: 30 });
            scene.decorations.push({ type: 'plant', x: 100, y: 500, size: 30 });

            // Exit door to yard - on left side
            scene.decorations.push({
                type: 'exit-door',
                x: 20,
                y: 370,
                width: 40,
                height: 60
            });

            scene.doors.push({
                x: 20,
                y: 370,
                width: 40,

        // Forklift entity (only in yard)
        function createForklift(startX, startY, patrolPath) {
            return {
                x: startX,
                y: startY,
                width: 30,
                height: 40,
                speed: 1.2,
                direction: 0,
                path: patrolPath,
                currentTarget: 0,

                update() {
                    if (currentSceneId !== 'yard') return;

                    const target = this.path[this.currentTarget];
                    const dx = target.x - this.x;
                    const dy = target.y - this.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 5) {
                        this.currentTarget = (this.currentTarget + 1) % this.path.length;
                    } else {
                        this.x += (dx / dist) * this.speed;
                        this.y += (dy / dist) * this.speed;

                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.direction = dx > 0 ? 1 : 3;
                        } else {
                            this.direction = dy > 0 ? 0 : 2;
                        }
                    }

                    const forkliftBox = this.getBox();
                    const playerBox = player.getBox();

                    if (rectCollision(forkliftBox, playerBox) && !player.stunned) {
                        this.hitPlayer();
                    }
                },

                getBox() {
                    return {
                        x: this.x - this.width/2,
                        y: this.y - this.height/2,
                        width: this.width,
                        height: this.height
                    };
                },

                hitPlayer() {
                    // Forklift collision is instant game over
                    createImpactParticles(player.x, player.y);
                    timeRemaining = 0;
                    calculateScore();
                    gameState = 'gameover';
                },

                draw() {
                    if (currentSceneId !== 'yard') return;

                    ctx.save();

                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(this.x + 2, this.y + this.height/2 + 3,
                               this.width/2, this.height/4, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(this.x - this.width/2, this.y - this.height/2,
                                this.width, this.height);

                    ctx.fillStyle = '#dd8800';
                    ctx.fillRect(this.x - this.width/2, this.y - this.height/2,
                                this.width, this.height * 0.4);

                    ctx.fillStyle = '#888';
                    if (this.direction === 0) {
                        ctx.fillRect(this.x - 10, this.y + this.height/2, 6, 30);
                        ctx.fillRect(this.x + 4, this.y + this.height/2, 6, 30);
                    } else if (this.direction === 1) {
                        ctx.fillRect(this.x + this.width/2, this.y - 10, 30, 6);
                        ctx.fillRect(this.x + this.width/2, this.y + 4, 30, 6);
                    } else if (this.direction === 2) {
                        ctx.fillRect(this.x - 10, this.y - this.height/2 - 30, 6, 30);
                        ctx.fillRect(this.x + 4, this.y - this.height/2 - 30, 6, 30);
                    } else {
                        ctx.fillRect(this.x - this.width/2 - 30, this.y - 10, 30, 6);
                        ctx.fillRect(this.x - this.width/2 - 30, this.y + 4, 30, 6);
                    }

                    ctx.fillStyle = '#000';
                    ctx.fillRect(this.x - this.width/2 + 2, this.y - 2, this.width - 4, 2);
                    ctx.fillRect(this.x - this.width/2 + 2, this.y + 2, this.width - 4, 2);

                    ctx.restore();
                }
            };
        }

        // Particles
        function createCollectionParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                const angle = (Math.PI * 2 * i) / 20;
                const speed = 2 + Math.random() * 3;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: 0.02,
                    size: 3 + Math.random() * 3,
                    color: Math.random() > 0.5 ? '#ffed4e' : '#ff6b35'
                });
            }
        }

        function createImpactParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 * i) / 12;
                const speed = 1 + Math.random() * 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: 0.03,
                    size: 2 + Math.random() * 2,
                    color: '#ff4444'
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= p.decay;
                return p.life > 0;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Generate world
        function generateWorld() {
            scenes.yard = buildYardScene();
            scenes.warehouseInterior = buildWarehouseInterior();
            scenes.officeInterior = buildOfficeInterior();
            scenes.workshopInterior = buildWorkshopInterior();

            // Generate random pallet locations
            generatePallets();

            // Create two forklifts
            forklifts = [
                createForklift(600, 650, [
                    { x: 600, y: 650 },
                    { x: 1400, y: 650 },
                    { x: 1400, y: 800 },
                    { x: 600, y: 800 }
                ]),
                createForklift(1200, 750, [
                    { x: 1200, y: 750 },
                    { x: 500, y: 750 },
                    { x: 500, y: 850 },
                    { x: 1200, y: 850 }
                ])
            ];
        }

        function generatePallets() {
            missingPallets = [];

            // Define how many pallets per scene
            const palletDistribution = [
                { sceneId: 'yard', count: 4 },
                { sceneId: 'warehouseInterior', count: 3 },
                { sceneId: 'officeInterior', count: 2 },
                { sceneId: 'workshopInterior', count: 1 }
            ];

            palletDistribution.forEach(dist => {
                const scene = scenes[dist.sceneId];
                for (let i = 0; i < dist.count; i++) {
                    let placed = false;
                    let attempts = 0;
                    const maxAttempts = 50;

                    while (!placed && attempts < maxAttempts) {
                        // Generate random position with margins
                        const x = 100 + Math.random() * (scene.width - 200);
                        const y = 100 + Math.random() * (scene.height - 200);

                        // Try to add pallet (will auto-validate and adjust position)
                        placed = addMissingPallet(dist.sceneId, x, y);
                        attempts++;
                    }

                    // If still not placed after all attempts, use guaranteed fallback positions
                    if (!placed) {
                        const fallbackPositions = [
                            { x: scene.width / 2, y: scene.height / 2 },
                            { x: scene.width / 4, y: scene.height / 2 },
                            { x: scene.width * 3/4, y: scene.height / 2 },
                            { x: scene.width / 2, y: scene.height / 4 },
                            { x: scene.width / 2, y: scene.height * 3/4 }
                        ];

                        for (const fallback of fallbackPositions) {
                            placed = addMissingPallet(dist.sceneId, fallback.x, fallback.y);
                            if (placed) break;
                        }

                        // Last resort: force placement at scene center (even if collision)
                        if (!placed) {
                            console.warn(`[Pallet Generation] Failed to place pallet in ${dist.sceneId}, forcing at center`);
                            missingPallets.push({
                                sceneId: dist.sceneId,
                                x: scene.width / 2,
                                y: scene.height / 2,
                                width: 30,
                                height: 30,
                                collected: false,
                                pulsePhase: Math.random() * Math.PI * 2
                            });
                        }
                    }
                }
            });
        }

        function addMissingPallet(sceneId, x, y) {
            // Validate pallet position doesn't overlap with obstacles
            const scene = scenes[sceneId];
            const palletBox = {
                x: x - 15,
                y: y - 15,
                width: 30,
                height: 30
            };

            // Check if pallet overlaps with any obstacle
            const hasCollision = scene.obstacles.some(obs => rectCollision(palletBox, obs));

            if (hasCollision) {
                // Search for nearby safe position
                const searchRadius = 100;
                const searchStep = 20;
                let foundSafe = false;

                for (let radius = searchStep; radius <= searchRadius; radius += searchStep) {
                    const angles = 12;
                    for (let i = 0; i < angles; i++) {
                        const angle = (Math.PI * 2 * i) / angles;
                        const testX = x + Math.cos(angle) * radius;
                        const testY = y + Math.sin(angle) * radius;

                        const testBox = {
                            x: testX - 15,
                            y: testY - 15,
                            width: 30,
                            height: 30
                        };

                        const testCollision = scene.obstacles.some(obs => rectCollision(testBox, obs));
                        if (!testCollision && testX >= 50 && testX <= scene.width - 50 && testY >= 50 && testY <= scene.height - 50) {
                            x = testX;
                            y = testY;
                            foundSafe = true;
                            break;
                        }
                    }
                    if (foundSafe) break;
                }

                // If no safe position found in spiral search, return false
                if (!foundSafe) {
                    return false;
                }
            }

            // Only add pallet if position is safe
            missingPallets.push({
                sceneId,
                x, y,
                width: 30,
                height: 30,
                collected: false,
                pulsePhase: Math.random() * Math.PI * 2
            });
            return true;
        }

        // Scene transition
        function switchScene(targetSceneId, spawnX, spawnY) {
            fadeDirection = 1;
            pendingSceneSwitch = { sceneId: targetSceneId, x: spawnX, y: spawnY };
        }

        function updateFade() {
            if (fadeDirection === 1) {
                fadeAlpha += 0.1;
                if (fadeAlpha >= 1) {
                    fadeAlpha = 1;
                    if (pendingSceneSwitch) {
                        currentSceneId = pendingSceneSwitch.sceneId;

                        // Validate and fix spawn position
                        const safeSpawn = validateAndFixSpawn(pendingSceneSwitch.x, pendingSceneSwitch.y);
                        player.x = safeSpawn.x;
                        player.y = safeSpawn.y;

                        camera.x = player.x - CONFIG.canvas.width / 2;
                        camera.y = player.y - CONFIG.canvas.height / 2;
                        pendingSceneSwitch = null;
                        fadeDirection = 2;

                        // Set door cooldown
                        doorCooldownUntil = Date.now() + CONFIG.game.doorCooldown;
                    }
                }
            } else if (fadeDirection === 2) {
                fadeAlpha -= 0.1;
                if (fadeAlpha <= 0) {
                    fadeAlpha = 0;
                    fadeDirection = 0;
                }
            }
        }

        // Rendering
        function drawGround() {
            const scene = scenes[currentSceneId];

            scene.groundAreas.forEach(area => {
                if (area.type === 'grass') {
                    ctx.fillStyle = '#7ec850';
                } else if (area.type === 'road') {
                    ctx.fillStyle = '#666666';
                } else if (area.type === 'tarmac') {
                    ctx.fillStyle = '#555555';
                } else if (area.type === 'warehouse-floor') {
                    ctx.fillStyle = '#888888';
                } else if (area.type === 'office-floor') {
                    ctx.fillStyle = '#a0a0a0';
                } else if (area.type === 'workshop-floor') {
                    ctx.fillStyle = '#7a7a7a';
                }

                ctx.fillRect(area.x, area.y, area.width, area.height);
            });

            if (currentSceneId === 'warehouseInterior') {
                ctx.strokeStyle = '#2a2a2a';
                ctx.lineWidth = 2;
                for (let x = 0; x < scene.width; x += 100) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, scene.height);
                    ctx.stroke();
                }
            } else if (currentSceneId === 'officeInterior') {
                ctx.fillStyle = '#6a6a6a';
                for (let x = 0; x < scene.width; x += 50) {
                    for (let y = 0; y < scene.height; y += 50) {
                        if ((x / 50 + y / 50) % 2 === 0) {
                            ctx.fillRect(x, y, 50, 50);
                        }
                    }
                }
            } else if (currentSceneId === 'yard') {
                scene.groundAreas.forEach(area => {
                    if (area.type === 'road') {
                        ctx.strokeStyle = '#ffed4e';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([15, 10]);
                        ctx.beginPath();
                        ctx.moveTo(area.x, area.y + area.height / 2);
                        ctx.lineTo(area.x + area.width, area.y + area.height / 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });
            }
        }

        function drawDecorations() {
            const scene = scenes[currentSceneId];

            scene.decorations.forEach(dec => {
                // Viewport culling - skip if off-screen
                if (!isInViewport(dec)) return;

                if (dec.type === 'oil-stain') {
                    ctx.fillStyle = 'rgba(40,40,40,0.25)';
                    ctx.beginPath();
                    ctx.ellipse(dec.x, dec.y, dec.size, dec.size * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (dec.type === 'parking-bay') {
                    ctx.strokeStyle = '#ffed4e';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(dec.x, dec.y, dec.width, dec.height);
                } else if (dec.type === 'footpath') {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(dec.x, dec.y, dec.width, dec.height);
                } else if (dec.type === 'cone') {
                    drawCone(dec);
                } else if (dec.type === 'floor-marking') {
                    ctx.fillStyle = '#ffed4e';
                    ctx.fillRect(dec.x, dec.y, dec.width, dec.height);
                } else if (dec.type === 'pallet-stack') {
                    ctx.fillStyle = '#8b6914';
                    ctx.fillRect(dec.x, dec.y, dec.width, dec.height);
                    ctx.fillStyle = '#6b5014';
                    for (let i = 0; i < 3; i++) {
                        ctx.fillRect(dec.x, dec.y + i * 13, dec.width, 3);
                    }
                } else if (dec.type === 'plant') {
                    ctx.fillStyle = '#2d5016';
                    ctx.beginPath();
                    ctx.arc(dec.x, dec.y, dec.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (dec.type === 'noticeboard') {
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(dec.x, dec.y, dec.width, dec.height);
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(dec.x, dec.y, dec.width, dec.height);
                } else if (dec.type === 'parked-car') {
                    // Car shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.fillRect(dec.x + 3, dec.y + 3, dec.width, dec.height);
                    // Car body
                    ctx.fillStyle = ['#cc0000', '#0044cc', '#555', '#fff'][Math.floor(dec.x / 100) % 4];
                    ctx.fillRect(dec.x, dec.y + 15, dec.width, dec.height - 15);
                    // Car top
                    ctx.fillRect(dec.x + 8, dec.y, dec.width - 16, 25);
                    // Windows
                    ctx.fillStyle = '#88ccff';
                    ctx.fillRect(dec.x + 10, dec.y + 3, dec.width - 20, 10);
                } else if (dec.type === 'tree') {
                    // Tree shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(dec.x + 2, dec.y + dec.size * 0.4 + 3, dec.size * 0.4, dec.size * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Tree trunk
                    ctx.fillStyle = '#8b6914';
                    const trunkWidth = dec.size * 0.3;
                    const trunkHeight = dec.size * 0.6;
                    ctx.fillRect(dec.x - trunkWidth/2, dec.y - trunkHeight/2, trunkWidth, trunkHeight);

                    // Tree foliage - three circles for a fuller look
                    ctx.fillStyle = '#4a7c3e';
                    ctx.beginPath();
                    ctx.arc(dec.x - dec.size * 0.2, dec.y - dec.size * 0.35, dec.size * 0.35, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#5a9c4e';
                    ctx.beginPath();
                    ctx.arc(dec.x + dec.size * 0.2, dec.y - dec.size * 0.35, dec.size * 0.35, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#6aac5e';
                    ctx.beginPath();
                    ctx.arc(dec.x, dec.y - dec.size * 0.5, dec.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (dec.type === 'gate') {
                    ctx.fillStyle = '#666';
                    ctx.fillRect(dec.x, dec.y, dec.width, dec.height);
                    ctx.strokeStyle = '#888';
                    ctx.lineWidth = 3;
                    for (let i = 0; i < dec.height; i += 10) {
                        ctx.beginPath();
                        ctx.moveTo(dec.x, dec.y + i);
                        ctx.lineTo(dec.x + dec.width, dec.y + i);
                        ctx.stroke();
                    }
                } else if (dec.type === 'exit-door') {
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(dec.x, dec.y, dec.width, dec.height);
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(dec.x, dec.y, dec.width, dec.height);
                    // Door handle
                    ctx.fillStyle = '#999';
                    ctx.fillRect(dec.x + dec.width - 15, dec.y + dec.height/2 - 3, 8, 6);
                } else if (dec.type === 'bay-door') {
                    ctx.fillStyle = '#ff6b35';
                    ctx.fillRect(dec.x, dec.y, dec.width, dec.height);
                    // Door sections
                    ctx.strokeStyle = '#d45520';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < dec.height; i += 8) {
                        ctx.beginPath();
                        ctx.moveTo(dec.x, dec.y + i);
                        ctx.lineTo(dec.x + dec.width, dec.y + i);
                        ctx.stroke();
                    }
                    // Bay number
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText(dec.number, dec.x + dec.width/2, dec.y + dec.height/2 + 6);
                    ctx.textAlign = 'left';
                }
            });
        }

        function drawObstacles() {
            const scene = scenes[currentSceneId];

            scene.obstacles.forEach(obs => {
                // Viewport culling - skip if off-screen
                if (!isInViewport(obs)) return;

                if (obs.type === 'warehouse-main') {
                    drawWarehouse(obs);
                } else if (obs.type === 'office') {
                    drawOffice(obs);
                } else if (obs.type === 'truck') {
                    drawTruck(obs);
                } else if (obs.type === 'fence-post') {
                    drawFencePost(obs);
                } else if (obs.type === 'wall') {
                    ctx.fillStyle = '#999';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'racking') {
                    drawRacking(obs);
                } else if (obs.type === 'internal-room') {
                    ctx.fillStyle = '#a0c0d0';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#80a0b0';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'desk') {
                    ctx.fillStyle = '#c09870';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#a08050';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'meeting-room') {
                    ctx.fillStyle = '#d0d0d0';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#b0b0b0';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'trailer') {
                    drawTrailer(obs);
                } else if (obs.type === 'workshop') {
                    drawWorkshop(obs);
                } else if (obs.type === 'workbench') {
                    ctx.fillStyle = '#c09870';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#a08050';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    // Tools on bench
                    ctx.fillStyle = '#666';
                    ctx.fillRect(obs.x + 10, obs.y + 10, 20, 8);
                    ctx.fillRect(obs.x + 40, obs.y + 15, 15, 6);
                } else if (obs.type === 'tool-cabinet') {
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#dd1111';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    // Drawers
                    for (let i = 0; i < 4; i++) {
                        ctx.strokeRect(obs.x + 5, obs.y + 10 + i * 22, obs.width - 10, 18);
                        ctx.fillStyle = '#888';
                        ctx.fillRect(obs.x + obs.width/2 - 3, obs.y + 17 + i * 22, 6, 4);
                    }
                } else if (obs.type === 'tree') {
                    // Tree visual is drawn in decorations, obstacle is just for collision
                    // Optionally draw debug hitbox if needed
                    if (showDebug) {
                        ctx.strokeStyle = 'rgba(255,0,0,0.3)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    }
                }
            });
        }

        function drawWarehouse(obs) {
            const shadowOffset = 6;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(obs.x + shadowOffset, obs.y + shadowOffset, obs.width, obs.height);

            ctx.fillStyle = '#99c8e0';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            ctx.strokeStyle = '#7ab0d0';
            ctx.lineWidth = 1;
            for (let i = 0; i < obs.width; i += 8) {
                ctx.beginPath();
                ctx.moveTo(obs.x + i, obs.y);
                ctx.lineTo(obs.x + i, obs.y + obs.height);
                ctx.stroke();
            }

            ctx.fillStyle = '#6a9ac0';
            ctx.fillRect(obs.x, obs.y, obs.width, 20);

            if (obs.bays) {
                obs.bays.forEach(bay => {
                    ctx.fillStyle = '#5a7d8c';
                    ctx.fillRect(bay.x, bay.y - 60, bay.width, 60);

                    ctx.strokeStyle = '#4a6d7c';
                    ctx.lineWidth = 2;
                    for (let j = 0; j < 5; j++) {
                        ctx.beginPath();
                        ctx.moveTo(bay.x, bay.y - 60 + j * 12);
                        ctx.lineTo(bay.x + bay.width, bay.y - 60 + j * 12);
                        ctx.stroke();
                    }
                });
            }
        }

        function drawOffice(obs) {
            const shadowOffset = 6;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(obs.x + shadowOffset, obs.y + shadowOffset, obs.width, obs.height);

            ctx.fillStyle = '#f0e0c0';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            const windowWidth = 18;
            const windowHeight = 22;
            const cols = 3;
            const rows = 6;
            const spacingX = (obs.width - cols * windowWidth) / (cols + 1);
            const spacingY = (obs.height - rows * windowHeight) / (rows + 1);

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const winX = obs.x + spacingX + col * (windowWidth + spacingX);
                    const winY = obs.y + spacingY + row * (windowHeight + spacingY);

                    ctx.fillStyle = '#a8d8f0';
                    ctx.fillRect(winX, winY, windowWidth, windowHeight);
                    ctx.strokeStyle = '#2a2a2a';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(winX, winY, windowWidth, windowHeight);
                }
            }
        }

        function drawTruck(obs) {
            const shadowOffset = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(obs.x + shadowOffset, obs.y + shadowOffset, obs.width, obs.height);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(obs.x, obs.y + 20, obs.width, obs.height - 30);

            ctx.fillStyle = '#ff3333';
            ctx.fillRect(obs.x + 5, obs.y, obs.width - 10, 25);

            ctx.fillStyle = '#88ccff';
            ctx.fillRect(obs.x + 8, obs.y + 3, obs.width - 16, 8);

            ctx.fillStyle = '#444';
            ctx.fillRect(obs.x + 5, obs.y + 20, 6, 6);
            ctx.fillRect(obs.x + obs.width - 11, obs.y + 20, 6, 6);
            ctx.fillRect(obs.x + 5, obs.y + obs.height - 12, 6, 6);
            ctx.fillRect(obs.x + obs.width - 11, obs.y + obs.height - 12, 6, 6);
        }

        function drawRacking(obs) {
            ctx.fillStyle = '#777';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            ctx.strokeStyle = '#666';
            ctx.lineWidth = 4;
            for (let i = 0; i < obs.height; i += 100) {
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + i);
                ctx.lineTo(obs.x + obs.width, obs.y + i);
                ctx.stroke();
            }

            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            for (let i = 0; i < obs.width; i += obs.width / 4) {
                ctx.beginPath();
                ctx.moveTo(obs.x + i, obs.y);
                ctx.lineTo(obs.x + i, obs.y + obs.height);
                ctx.stroke();
            }
        }

        function drawCone(obs) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(obs.x + obs.width/2 + 1, obs.y + obs.height + 2,
                       obs.width/2, obs.height/4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.moveTo(obs.x + obs.width/2, obs.y);
            ctx.lineTo(obs.x, obs.y + obs.height);
            ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(obs.x + obs.width/2 - 4, obs.y + obs.height * 0.3);
            ctx.lineTo(obs.x + 2, obs.y + obs.height * 0.45);
            ctx.lineTo(obs.x + obs.width - 2, obs.y + obs.height * 0.45);
            ctx.closePath();
            ctx.fill();
        }

        function drawFencePost(obs) {
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(obs.x + 2, obs.y + 2, obs.width, obs.height);

            ctx.fillStyle = '#888';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            ctx.fillStyle = '#999';
            ctx.fillRect(obs.x - 1, obs.y, obs.width + 2, 2);
        }

        function drawTrailer(obs) {
            const shadowOffset = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(obs.x + shadowOffset, obs.y + shadowOffset, obs.width, obs.height);

            // Main trailer body - bright white/silver
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            // Vertical ribs
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            for (let i = 0; i < obs.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + i);
                ctx.lineTo(obs.x + obs.width, obs.y + i);
                ctx.stroke();
            }

            // Border
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 2;
            ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

            // Door at back
            ctx.fillStyle = '#bbb';
            ctx.fillRect(obs.x + obs.width - 3, obs.y + obs.height/2 - 20, 3, 40);
        }

        function drawWorkshop(obs) {
            const shadowOffset = 6;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(obs.x + shadowOffset, obs.y + shadowOffset, obs.width, obs.height);

            // Main building - bright industrial grey
            ctx.fillStyle = '#8aa0b0';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            // Corrugated effect
            ctx.strokeStyle = '#7a90a0';
            ctx.lineWidth = 1;
            for (let i = 0; i < obs.width; i += 10) {
                ctx.beginPath();
                ctx.moveTo(obs.x + i, obs.y);
                ctx.lineTo(obs.x + i, obs.y + obs.height);
                ctx.stroke();
            }

            // Roof
            ctx.fillStyle = '#6a8090';
            ctx.fillRect(obs.x, obs.y, obs.width, 20);

            // Large roller door
            ctx.fillStyle = '#ff6b35';
            const doorWidth = obs.width * 0.6;
            const doorHeight = obs.height * 0.7;
            const doorX = obs.x + (obs.width - doorWidth) / 2;
            const doorY = obs.y + obs.height - doorHeight;
            ctx.fillRect(doorX, doorY, doorWidth, doorHeight);

            // Door sections
            ctx.strokeStyle = '#d45520';
            ctx.lineWidth = 3;
            for (let i = 0; i < doorHeight; i += 25) {
                ctx.beginPath();
                ctx.moveTo(doorX, doorY + i);
                ctx.lineTo(doorX + doorWidth, doorY + i);
                ctx.stroke();
            }

            // Window
            ctx.fillStyle = '#a8d8f0';
            ctx.fillRect(obs.x + 20, obs.y + 30, 40, 30);
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 2;
            ctx.strokeRect(obs.x + 20, obs.y + 30, 40, 30);
        }

        function drawMissingPallets() {
            const time = Date.now() / 1000;

            missingPallets.forEach(pallet => {
                if (!pallet.collected && pallet.sceneId === currentSceneId) {
                    const pulse = Math.sin(time * 3 + pallet.pulsePhase) * 0.15 + 0.85;

                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffed4e';

                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.fillRect(pallet.x - pallet.width/2 + 3, pallet.y - pallet.height/2 + 3,
                                pallet.width, pallet.height);

                    ctx.save();
                    ctx.translate(pallet.x, pallet.y);
                    ctx.scale(pulse, pulse);

                    ctx.fillStyle = '#ffed4e';
                    ctx.fillRect(-pallet.width/2, -pallet.height/2, pallet.width, pallet.height);

                    ctx.fillStyle = '#d4c520';
                    const slatCount = 4;
                    const slatHeight = 2;
                    const spacing = pallet.height / slatCount;

                    for (let i = 0; i < slatCount; i++) {
                        ctx.fillRect(-pallet.width/2, -pallet.height/2 + i * spacing,
                                    pallet.width, slatHeight);
                    }

                    ctx.fillStyle = '#b4a520';
                    ctx.fillRect(-pallet.width/2 + 4, -pallet.height/2, 2, pallet.height);
                    ctx.fillRect(-1, -pallet.height/2, 2, pallet.height);
                    ctx.fillRect(pallet.width/2 - 6, -pallet.height/2, 2, pallet.height);

                    ctx.restore();
                    ctx.shadowBlur = 0;
                }
            });
        }

        function drawMinimap() {
            if (!showMinimap) return;

            const mmSize = 150;
            const mmX = CONFIG.canvas.width - mmSize - 10;
            const mmY = 10;
            const scene = scenes[currentSceneId];
            const scale = mmSize / Math.max(scene.width, scene.height);

            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(mmX, mmY, mmSize, mmSize);

            ctx.strokeStyle = '#ffed4e';
            ctx.lineWidth = 2;
            ctx.strokeRect(mmX, mmY, mmSize, mmSize);

            ctx.save();
            ctx.translate(mmX, mmY);

            scene.obstacles.forEach(obs => {
                if (obs.type !== 'fence-post') {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(obs.x * scale, obs.y * scale,
                                Math.max(2, obs.width * scale), Math.max(2, obs.height * scale));
                }
            });

            missingPallets.forEach(pallet => {
                if (!pallet.collected && pallet.sceneId === currentSceneId) {
                    ctx.fillStyle = '#ffed4e';
                    ctx.fillRect(pallet.x * scale - 2, pallet.y * scale - 2, 4, 4);
                }
            });

            if (currentSceneId === 'yard') {
                ctx.fillStyle = '#ffaa00';
                forklifts.forEach(forklift => {
                    ctx.fillRect(forklift.x * scale - 2, forklift.y * scale - 2, 4, 4);
                });
            }

            ctx.fillStyle = '#ff6b35';
            ctx.fillRect(player.x * scale - 2, player.y * scale - 2, 4, 4);

        function calculateScore() {
            const palletScore = palletsCollected * 100;
            const timeBonus = Math.max(0, Math.ceil(timeRemaining));
            const penalty = (CONFIG.game.totalPallets - palletsCollected) * 50;
            score = palletScore + timeBonus - penalty;

            if (score > bestScore) {
                bestScore = score;
                try {
                    localStorage.setItem('palletsBestScore', bestScore.toString());
                } catch (e) {
                    console.warn('Could not save best score to localStorage:', e);
                }
            }
        }

            const emoji = palletsCollected === CONFIG.game.totalPallets ? '🎉' : '📦';
            const text = `${emoji} Find the Pallets: ${palletsCollected}/${CONFIG.game.totalPallets} pallets found | Score: ${score}`;

            navigator.clipboard.writeText(text).then(() => {
                console.log('Result copied to clipboard!');
            }).catch(() => {
                console.log('Copy failed');
            });
        }

        function restartGame() {
            gameState = 'playing';
            currentSceneId = 'yard';
            timeRemaining = CONFIG.game.timeLimit;
            timerStarted = false;
            palletsCollected = 0;
            score = 0;
            particles = [];

            // Validate spawn position to prevent spawning in obstacles
            const safeSpawn = validateAndFixSpawn(CONFIG.player.x, CONFIG.player.y);
            player.x = safeSpawn.x;
            player.y = safeSpawn.y;

            player.hasMoved = false;
            player.stunned = false;
            fadeAlpha = 0;
            fadeDirection = 0;
            doorCooldownUntil = 0;

            // Regenerate pallets at random positions for better replayability
            generatePallets();

            // Reset forklifts
            if (forklifts.length > 0) {
                forklifts[0].x = 600;
                forklifts[0].y = 650;
                forklifts[0].currentTarget = 0;
            }
            if (forklifts.length > 1) {
                forklifts[1].x = 1200;
                forklifts[1].y = 750;
                forklifts[1].currentTarget = 0;
            }
        }

        function updateGame() {
            const now = Date.now();
            // Cap deltaTime to 100ms to prevent timer exploits when tab is backgrounded
            const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            if (gameState === 'playing') {
                player.update();
                forklifts.forEach(f => f.update());
                camera.update(player);
                updateParticles();
                updateFade();

                if (timerStarted && timeRemaining > 0) {
                    timeRemaining -= deltaTime;

                    if (timeRemaining <= 0) {
                        timeRemaining = 0;
                        calculateScore();
                        gameState = palletsCollected === CONFIG.game.totalPallets ? 'success' : 'gameover';
                    }
                }

                if (keyPressed[' ']) {
                    const nearestPallet = player.getNearestPallet();
                    const nearestDoor = player.getNearestDoor();

                    if (nearestPallet) {
                        nearestPallet.collected = true;
                        palletsCollected++;
                        createCollectionParticles(nearestPallet.x, nearestPallet.y);

                        if (palletsCollected === CONFIG.game.totalPallets) {
                            calculateScore();
                            gameState = 'success';
                        }
                    } else if (nearestDoor && fadeDirection === 0) {
                        switchScene(nearestDoor.targetSceneId, nearestDoor.targetSpawnX, nearestDoor.targetSpawnY);
                    }

                    keyPressed[' '] = false;
                }

                if (keyPressed['m'] || keyPressed['M']) {
                    showMinimap = !showMinimap;
                    keyPressed['m'] = false;
                    keyPressed['M'] = false;
                }

                if (keyPressed['d'] || keyPressed['D']) {
                    showDebug = !showDebug;
                    keyPressed['d'] = false;
                    keyPressed['D'] = false;
                }
            }
        }

        function gameLoop() {
            if (gameState === 'start') {
                drawStartScreen();
            } else if (gameState === 'playing') {
                updateGame();

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

                ctx.save();
                ctx.translate(-camera.x, -camera.y);

                drawGround();
                drawDecorations();
                drawObstacles();
                drawMissingPallets();

                const entities = [
                    { obj: player, y: player.y, draw: () => player.draw() }
                ];

                if (currentSceneId === 'yard') {
                    forklifts.forEach(forklift => {
                        entities.push({ obj: forklift, y: forklift.y, draw: () => forklift.draw() });
                    });
                }

                entities.sort((a, b) => a.y - b.y);
                entities.forEach(e => e.draw());

                drawParticles();
                drawInteractionPrompt();
                drawDebugOverlay();

                ctx.restore();

                drawHUD();
                drawMinimap();
                drawFadeOverlay();
            } else if (gameState === 'gameover' || gameState === 'success') {
                drawEndScreen();
            }

            requestAnimationFrame(gameLoop);
        }

        // Input Handling
        window.addEventListener('keydown', (e) => {
            if (gameState === 'start') {
                gameState = 'playing';
                lastFrameTime = Date.now();
            } else if ((gameState === 'gameover' || gameState === 'success') && e.key === 'Enter') {
                restartGame();
            }

            keys[e.key] = true;
            keyPressed[e.key] = true;

            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('click', (e) => {
            if (gameState === 'gameover' || gameState === 'success') {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (x >= CONFIG.canvas.width / 2 - 120 && x <= CONFIG.canvas.width / 2 + 120 &&
                    y >= 450 && y <= 490) {
                    copyResult();
                }
            }
        });

        // Initialize and Start
        generateWorld();

        // Validate initial player spawn position
        const initialSpawn = validateAndFixSpawn(CONFIG.player.x, CONFIG.player.y);
        player.x = initialSpawn.x;
        player.y = initialSpawn.y;

        gameLoop();
    </script>
</body>
